<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Life 2026 — Quest Log</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f2ec;
  --bg2: #f0e9df;
  --bg3: #e8dfd3;
  --border: #d4c8ba;
  --border2: #c0b4a4;
  --text: #1e1810;
  --text2: #4a3e34;
  --text3: #6a5e54;
  --gold: #7a5420;
  --gold2: #9a7030;
  --gold-dim: #f0e4c4;
  --green: #2a6035;
  --green2: #1a4825;
  --green-dim: #d4eeda;
  --blue: #1e4a6a;
  --blue2: #0e3050;
  --blue-dim: #d4e8f8;
  --purple: #4a2868;
  --purple2: #2a0848;
  --purple-dim: #e8d4f8;
  --orange: #6a3818;
  --orange2: #4a1800;
  --orange-dim: #f8dcc8;
  --teal: #145858;
  --teal2: #043838;
  --teal-dim: #c8ecec;
  --red: #682828;
  --red2: #480808;
  --xp-color: #7a5420;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 26px; /* FIXED: Global size for iPad */
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.app { 
  position:relative; 
  z-index:1; 
  max-width:100%; 
  margin:0 auto; 
  padding:0 0 100px;
  min-height: 100vh; /* FIXED: Stretches to bottom of iPad */
  display: flex;
  flex-direction: column;
}

/* BACKGROUND TEXTURE */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(160,120,64,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(90,138,106,0.05) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

/* ── HEADER / HERO ── */
.hero {
  background: linear-gradient(180deg, #ece4d8 0%, var(--bg) 100%);
  padding: 20px 16px 0;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.hero-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 600; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
.hero-date { font-size: 14px; color: var(--text2); font-family: 'DM Mono', monospace; }

/* LEVEL DISPLAY */
.level-display { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.level-badge {
  width: 60px; height: 60px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle, #f8f0e4 0%, #f0e4d0 100%);
  flex-shrink: 0;
}
.level-num { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; color: var(--gold); line-height: 1; }
.level-info { flex: 1; }
.level-name { font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold); }
.level-desc { font-size: 14px; color: var(--text2); font-style: italic; }

.xp-bar-wrap { background: var(--bg3); border-radius: 4px; height: 8px; overflow: hidden; border: 1px solid var(--border); margin-top: 5px;}
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold2)); transition: width 0.6s ease; }
.xp-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; margin-top: 5px; }

/* STATS ROW */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 0 -16px; }
.stat-cell { background: var(--bg3); padding: 12px 4px; text-align: center; }
.stat-val { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 600; line-height: 1; }
.stat-lbl { font-size: 10px; color: var(--text2); font-family: 'DM Mono', monospace; text-transform: uppercase; }

/* TABS */
.tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 160px; z-index: 99; }
.tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-family: 'DM Mono', monospace; color: var(--text2); cursor: pointer; border-bottom: 3px solid transparent; }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* CONTENT PANELS */
.panel { display: none; padding: 16px; }
.panel.active { display: block; }

/* QUEST ITEMS & CHECKBOXES */
.quest-section { margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); overflow: hidden;}
.quest-item {
  display: flex; align-items: center; gap: 15px; padding: 15px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.qi-name { font-size: 24px; color: var(--text); line-height: 1.3; font-weight: 500;}
.qi-detail { font-size: 17px; color: var(--text2); font-style: italic; margin-top: 4px;}

/* THE CHECKBOXES */
.qi-check {
  width: 35px !important;
  height: 35px !important;
  border: 2px solid var(--border2);
  border-radius: 6px;
  flex-shrink: 0;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
}
.quest-item.done .qi-check { background: var(--green-dim); border-color: var(--green); }
.qi-check-inner { width: 18px; height: 18px; background: var(--green2); border-radius: 3px; opacity: 0; transition: 0.2s; }
.quest-item.done .qi-check-inner { opacity: 1; }

.qi-xp-badge {
    font-family: monospace; font-size: 16px; font-weight: 900; 
    color: #1a0a00; background: #f5c842; border-radius: 6px; 
    padding: 6px 12px; border: 2px solid #8a6000;
}

</style>
</head>
<body>

<div class="app">
  <div class="hero">
    <div class="hero-top">
      <div class="hero-title">🦋 My Life 2026</div>
      <div class="hero-date">Saturday, Feb 28</div>
    </div>
    <div class="level-display">
      <div class="level-badge">
        <div class="level-num">1</div>
        <div class="level-word">LVL</div>
      </div>
      <div class="level-info">
        <div class="level-name">The Foundation</div>
        <div class="level-desc">Building the first habits</div>
        <div class="xp-bar-wrap"><div class="xp-bar-fill" style="width:30%"></div></div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-cell"><div class="stat-val">0🔥</div><div class="stat-lbl">Streak</div></div>
      <div class="stat-cell"><div class="stat-val">0</div><div class="stat-lbl">XP Today</div></div>
      <div class="stat-cell"><div class="stat-val">240</div><div class="stat-lbl">FS Hrs</div></div>
      <div class="stat-cell"><div class="stat-val">0</div><div class="stat-lbl">Wk XP</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active">Today</div>
    <div class="tab">Progress</div>
    <div class="tab">Log</div>
  </div>

  <div class="panel active">
    <div class="quest-section">
       <div class="quest-item">
          <div class="qi-check"><div class="qi-check-inner"></div></div>
          <div class="qi-content">
            <div class="qi-name">★ Bible Reading</div>
            <div class="qi-detail">Read next 2 chapters from Isaiah onward</div>
          </div>
          <div class="qi-xp-badge">+25 XP</div>
       </div>
       <div class="quest-item">
          <div class="qi-check"><div class="qi-check-inner"></div></div>
          <div class="qi-content">
            <div class="qi-name">★ Daily Text</div>
            <div class="qi-detail">Read and reflect on today's text</div>
          </div>
          <div class="qi-xp-badge">+15 XP</div>
       </div>
    </div>
  </div>
</div>

</body>
</html>
