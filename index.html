<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Life 2026 - Enhanced</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#e8ede8; --bg2:#dfe8df; --bg3:#d4e0d4;
  --border:#b8ccb8; --border2:#a4bca4;
  --text:#1a1a14; --text2:#2a2e1e; --text3:#4a5a3e;
  --gold:#7a4e1e; --gold2:#6b4010; --gold-dim:#f0dfc0; --gold-bg:#f8eed8;
  --purple:#7a3a2a; --purple-dim:#f0d4cc;
  --bottom-h:64px;
}

/* Dark Mode Variables */
[data-theme="dark"] {
  --bg:#1a1c1a; --bg2:#252a25; --bg3:#2d352d;
  --border:#3a453a; --border2:#4a5a4a;
  --text:#e0e0e0; --text2:#b0b0b0; --text3:#8a9a8a;
  --gold:#c5a059; --gold2:#d4b483; --gold-dim:#4a3c20; --gold-bg:#2a2518;
  --purple:#a56a5a; --purple-dim:#3d2520;
}

body {
  font-family: 'Crimson Pro', serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
  margin: 0;
  padding-bottom: var(--bottom-h);
}

.hero {
  background: var(--bg2);
  padding: 16px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}

.controls-row {
  display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end;
}

.btn-utility {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); padding: 4px 8px; border-radius: 4px;
  font-size: 11px; cursor: pointer; font-family: 'DM Mono', monospace;
}

canvas { max-width: 100%; margin-top: 20px; background: var(--bg2); border-radius: 8px; padding: 10px; }

/* Existing Quest Styling ... */
.quest-item {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 12px; margin: 8px 16px; border-radius: 10px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.quest-item.done { opacity: 0.6; border-color: var(--gold); }
</style>
</head>
<body>

<div class="hero">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 style="font-family:'Cinzel'; font-size:18px;">🦋 MY LIFE 2026</h1>
    <div id="totalXP" style="font-family:'DM Mono'; color:var(--gold);">XP: 0</div>
  </div>
  
  <div class="controls-row">
    <button class="btn-utility" onclick="toggleDarkMode()">🌓 Mode</button>
    <button class="btn-utility" onclick="exportData()">📤 Export</button>
    <button class="btn-utility" onclick="document.getElementById('importFile').click()">📥 Import</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
  </div>
</div>

<div id="main-content" style="padding: 16px;">
  <h2 style="font-family:'Cinzel'; font-size:14px; margin-bottom:10px;">Daily Quests</h2>
  <div id="quest-list">
    </div>

  <h2 style="font-family:'Cinzel'; font-size:14px; margin: 20px 0 10px;">XP Progress</h2>
  <canvas id="xpChart"></canvas>
</div>

<script>
// --- CORE STATE ---
let S = {
  xp: 0,
  history: [10, 25, 15, 30, 20, 45, 0], // Sample data for chart
  tasks: {},
  theme: 'light'
};

// --- DATA PERSISTENCE ---
function save() {
  localStorage.setItem('myLife2026_data', JSON.stringify(S));
}

function load() {
  const saved = localStorage.getItem('myLife2026_data');
  if (saved) S = JSON.parse(saved);
  if (S.theme === 'dark') document.body.setAttribute('data-theme', 'dark');
  render();
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S));
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", "mylife_backup.json");
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

function importData(event) {
  const reader = new FileReader();
  reader.onload = function(e) {
    S = JSON.parse(e.target.result);
    save();
    location.reload();
  };
  reader.readAsText(event.target.files[0]);
}

// --- UI ENHANCEMENTS ---
function toggleDarkMode() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  S.theme = isDark ? 'light' : 'dark';
  save();
}

function triggerHaptic() {
  if (window.navigator.vibrate) window.navigator.vibrate(15);
}

// --- CHARTS ---
let chart;
function initChart() {
  const ctx = document.getElementById('xpChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      datasets: [{
        label: 'XP Gained',
        data: S.history,
        borderColor: '#7a4e1e',
        tension: 0.3,
        fill: true,
        backgroundColor: 'rgba(122, 78, 30, 0.1)'
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

// --- RENDERING ---
const dailyQuests = [
  { id: 'q1', title: 'Morning Reading', xp: 10 },
  { id: 'q2', title: 'Language Lesson', xp: 15 },
  { id: 'q3', title: 'Daily Workout', xp: 20 }
];

function toggleQuest(id, xp) {
  triggerHaptic();
  if (!S.tasks[id]) {
    S.tasks[id] = true;
    S.xp += xp;
  } else {
    delete S.tasks[id];
    S.xp -= xp;
  }
  save();
  render();
}

function render() {
  document.getElementById('totalXP').textContent = `XP: ${S.xp}`;
  const list = document.getElementById('quest-list');
  list.innerHTML = dailyQuests.map(q => `
    <div class="quest-item ${S.tasks[q.id] ? 'done' : ''}" onclick="toggleQuest('${q.id}', ${q.xp})">
      <div style="flex:1">
        <div style="font-weight:600">${q.title}</div>
        <div style="font-size:11px; color:var(--gold)">+${q.xp} XP</div>
      </div>
      <div>${S.tasks[q.id] ? '✅' : '⭕'}</div>
    </div>
  `).join('');
}

// Initialize
load();
initChart();
</script>
</body>
</html>
